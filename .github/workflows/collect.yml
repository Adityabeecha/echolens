# Free-tier scheduled monitoring for EchoLens.
# Northflank has no free cron; GitHub Actions cron is free. This pings the deployed
# backend every 6 hours to collect new data, scan for anomalies, and triage —
# so the "watch feedback → investigate" loop runs without you.
#
# Setup: in the repo settings → Secrets and variables → Actions, add:
#   ECHOLENS_API              = https://<your-service>.code.run   (no trailing slash)
#   ECHOLENS_AUTOMATION_TOKEN = the same 32+ character value as AUTOMATION_TOKEN on the API
# The older ECHOLENS_EMAIL / ECHOLENS_PASSWORD (a reviewer login) still work while
# no automation token is set, but a token is not anyone's password: prefer it.
#
# SECURITY: use a dedicated, low-privilege REVIEWER account for automation (not
# an admin and not a personal login), with a unique password stored only in
# these secrets. Rotate it if it ever leaks. The password is only read from the
# environment and never echoed; do not add `set -x` to these scripts.
name: EchoLens scheduled collect + scan

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets exist
        env:
          API: ${{ secrets.ECHOLENS_API }}
          AUTO: ${{ secrets.ECHOLENS_AUTOMATION_TOKEN }}
          EMAIL: ${{ secrets.ECHOLENS_EMAIL }}
          PASSWORD: ${{ secrets.ECHOLENS_PASSWORD }}
        run: |
          missing=""
          [ -n "$API" ] || missing="$missing ECHOLENS_API"
          if [ -z "$AUTO" ] && { [ -z "$EMAIL" ] || [ -z "$PASSWORD" ]; }; then
            missing="$missing ECHOLENS_AUTOMATION_TOKEN"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "secrets present; API host = $(echo "$API" | sed -E 's#https?://([^/]+).*#\1#')"

      - name: Wake the service
        env:
          API: ${{ secrets.ECHOLENS_API }}
        # The container stays up, but a redeploy can still be mid-rollout.
        # Poll /health until it answers so the real calls below don't hit a cold
        # start and time out.
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$API/health" || echo 000)
            if [ "$code" = "200" ]; then echo "awake after ${i} attempt(s)"; exit 0; fi
            echo "attempt $i: /health → $code, retrying in 10s"
            sleep 10
          done
          echo "::error::$API/health never returned 200 — check the service in Northflank."
          exit 1

      - name: Log in and run the pipeline for every product
        env:
          API: ${{ secrets.ECHOLENS_API }}
          AUTO: ${{ secrets.ECHOLENS_AUTOMATION_TOKEN }}
          EMAIL: ${{ secrets.ECHOLENS_EMAIL }}
          PASSWORD: ${{ secrets.ECHOLENS_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$AUTO" ]; then
            TOKEN="$AUTO"
          else
          echo "::warning::Signing in with ECHOLENS_EMAIL/PASSWORD. Set ECHOLENS_AUTOMATION_TOKEN instead."
          body=$(curl -s --max-time 60 -w '\n%{http_code}' -X POST "$API/auth/login" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,os;print(json.dumps({"email":os.environ["EMAIL"],"password":os.environ["PASSWORD"]}))')")
          code=$(echo "$body" | tail -n1)
          if [ "$code" != "200" ]; then
            echo "::error::login failed (HTTP $code) — check ECHOLENS_EMAIL / ECHOLENS_PASSWORD"
            exit 1
          fi
          TOKEN=$(echo "$body" | sed '$d' | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          fi
          auth="Authorization: Bearer $TOKEN"
          # Every call says what went wrong. `curl -sf` hid the status, so a
          # rejected token and a timeout looked the same in the log.
          call() {  # METHOD URL [MAX_SECONDS]; prints the body, or the HTTP status and error
            local out code
            out=$(curl -s --max-time "${3:-120}" -X "$1" "$2" -H "$auth" -w '\n%{http_code}') \
              || { echo "  no answer within ${3:-120}s (network error or timeout)"; return 1; }
            code=$(echo "$out" | tail -n1)
            if [ "$code" -ge 400 ]; then
              echo "  HTTP $code: $(echo "$out" | sed '$d' | head -c 300)"; return 1
            fi
            echo "$out" | sed '$d'
          }

          echo "→ collect (all sources)"
          call POST "$API/collectors/run" 300 >/dev/null || echo "  collect failed (non-fatal)"

          # Since v8.0 every scan/triage is product-scoped: with no product_id the
          # API falls back to the first product, so a bare call would only ever
          # scan one. Enumerate and run each.
          plist=$(call GET "$API/products" 60) || { echo "::error::couldn't list products —$plist"; exit 1; }
          products=$(echo "$plist" \
            | python3 -c "import sys,json;print(' '.join(str(p['id']) for p in json.load(sys.stdin)['products']))")
          if [ -z "$products" ]; then echo "::warning::no products configured"; fi

          for pid in $products; do
            echo "→ product $pid: scan";   call POST "$API/anomalies/scan?product_id=$pid" 300 >/dev/null || echo "  scan failed"
            # run=true actually OPENS cases. Without it this is only a preview —
            # the scheduled job would review anomalies and start nothing.
            echo "→ product $pid: triage"; call POST "$API/anomalies/triage?run=true&product_id=$pid" 300 >/dev/null || echo "  triage failed"
          done

          echo "→ digest";   call POST "$API/alerts/digest?hours=24" >/dev/null || echo "  digest failed"
          echo "→ fixwatch"; call POST "$API/fixwatch/evaluate" >/dev/null || echo "  fixwatch failed"
          # Off unless RETENTION_DAYS is set on the API; then deletes raw feedback older than that.
          echo "→ retention"; call POST "$API/retention/apply" || echo "  retention failed"
          # Last, because it rebuilds the demo product in the background: a no-op
          # until the demo's newest review is a week old, then it re-dates it.
          echo "→ demo";     call POST "$API/demo/refresh" 60 || echo "  demo refresh failed"
          echo "done"
