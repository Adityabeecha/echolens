<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoLens investigates product feedback the way an analyst would: every conclusion backed by evidence you can click."
    />
    <meta name="theme-color" content="#0a0b0e" />
    <!-- Match the application canvas before the stylesheet arrives. -->
    <style>
      html, body { margin: 0; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0a0b0e; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f6f9; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded WITHOUT blocking first paint.
         A plain stylesheet link blocks rendering until fonts.googleapis.com
         answers, and that CSS then triggers a second round trip to
         fonts.gstatic.com. media="print" + a load listener (in boot.js) flips
         it to a real stylesheet once it has arrived, so the app paints in the
         fallback face immediately. `display=swap` already meant a visible
         swap; this only stops the wait being blank. -->
    <link
      id="el-fonts"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
    />
    <!-- Theme + font switch before first paint. External, not inline, so the
         Content-Security-Policy needs no 'unsafe-inline' for scripts. -->
    <script src="/boot.js"></script>
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>EchoLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
