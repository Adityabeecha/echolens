<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoLens investigates product feedback the way an analyst would: every conclusion backed by evidence you can click."
    />
    <!-- The mobile browser chrome matches the app instead of staying light and
         clashing with a dark dashboard. -->
    <meta name="theme-color" content="#f3f0e9" />
    <!-- Inline, so the page is dark from the first frame. Without it there is a
         white flash before the stylesheet applies body{background}. -->
    <style>
      html,
      body {
        background: #f3f0e9;
        margin: 0;
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%231b2022'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f6f2e9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23d1493f'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded WITHOUT blocking first paint.
         A plain stylesheet link blocks rendering until fonts.googleapis.com
         answers, and that CSS then triggers a second round trip to
         fonts.gstatic.com. media="print" + onload flips it to a real stylesheet
         once it has arrived, so the app paints in the fallback face
         immediately. `display=swap` already meant a visible swap; this only
         stops the wait being blank. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>EchoLens</title>
  </head>
  <body>
    <!--
      THESIS: EchoLens is an evidence docket that makes the chain from customer signal to verified fix inspectable; it refuses the category-default grid of disconnected dashboard cards.
      OWN-WORLD: Mineral paper, graphite navigation, vermilion evidence marks, cobalt references, ruled registers, dossier stamps, numbered cases, compact SVG line icons, Fraunces headings and Plex body copy.
      STORY: A product lead sees what needs attention, follows the active investigations, opens a case, tests its evidence, reviews the finding and tracks the recommended fix without losing provenance.
      FIRST VIEWPORT: Graphite navigation at left; workflow rail above a two-column briefing desk with signal intake dominant, running investigations stacked at right, and the resolution register immediately below. Actions sit at row ends.
      FORM: Forensic Evidence Docket, position 6 in the grounded direction list; seed d344aae4.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
