<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoLens investigates product feedback the way an analyst would: every conclusion backed by evidence you can click."
    />
    <meta name="theme-color" content="#101816" />
    <script>
      (() => {
        let theme = "dark";
        try {
          theme = localStorage.getItem("echolens_theme") === "light" ? "light" : "dark";
        } catch {
          // Restricted storage is a valid browser state; Dark remains safe.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === "dark" ? "#101816" : "#f6f4ef";
      })();
    </script>
    <!-- Match the application canvas before the stylesheet arrives. -->
    <style>
      html, body { margin: 0; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #101816; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f6f4ef; }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%231b2022'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f6f2e9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23d1493f'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded WITHOUT blocking first paint.
         A plain stylesheet link blocks rendering until fonts.googleapis.com
         answers, and that CSS then triggers a second round trip to
         fonts.gstatic.com. media="print" + onload flips it to a real stylesheet
         once it has arrived, so the app paints in the fallback face
         immediately. `display=swap` already meant a visible swap; this only
         stops the wait being blank. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>EchoLens</title>
  </head>
  <body>
    <!--
      THESIS: EchoLens is a human evidence workspace: warm enough to feel calm and approachable, precise enough to make every product decision traceable.
      OWN-WORLD: Warm stone canvas, deep ink navigation, paper-white evidence surfaces, restrained teal actions, small semantic state colors, IBM Plex typography, consistent line icons, and structure carried by spacing before borders.
      STORY: A product lead sees what needs attention, follows the active investigations, opens a case, tests its evidence, reviews the finding and tracks the recommended fix without losing provenance.
      FIRST VIEWPORT: Recessed navigation at left; one compact page header above a two-column work view with decisions dominant, active investigations secondary, and verified outcomes following in reading order.
      FORM: A hybrid of Human Signal Studio and Precision Workspace: plain-language prioritization paired with disciplined evidence density. SEED: approved Figma concepts in nodes 3:2 and 3:6.
      FINISH: Responsive contract, browser captures, craft review, and DESIGN.md are part of the shipped result.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
