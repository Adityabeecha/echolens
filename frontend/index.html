<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoLens investigates product feedback the way an analyst would: every conclusion backed by evidence you can click."
    />
    <!-- The mobile browser chrome matches the app instead of staying light and
         clashing with a dark dashboard. -->
    <meta name="theme-color" content="#0e0f13" />
    <!-- Inline, so the page is dark from the first frame. Without it there is a
         white flash before the stylesheet applies body{background}. -->
    <style>
      html,
      body {
        background: #0e0f13;
        margin: 0;
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f0a63c' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f0a63c'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded WITHOUT blocking first paint.
         A plain stylesheet link blocks rendering until fonts.googleapis.com
         answers, and that CSS then triggers a second round trip to
         fonts.gstatic.com. media="print" + onload flips it to a real stylesheet
         once it has arrived, so the app paints in the fallback face
         immediately. `display=swap` already meant a visible swap; this only
         stops the wait being blank. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>EchoLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
